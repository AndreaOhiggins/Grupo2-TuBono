<body class="bg-white px-3 py-8">

    <section class="mt-8 mb-15">
        <div class="ml-9">
            <h2 class="text-gray-900 lg:text-3xl text-2xl font-bold">¡Bienvenido, {{userData?.username}}!</h2>
        </div>

    </section>

    <!-- Table -->

    <div class="relative overflow-x-auto shadow-md sm:rounded-lg mt-9 mx-9">
        <table class="w-full text-md text-left rtl:text-right text-white bg-cyan-700">
            <thead>
                <tr>
                    <th colspan="7" class="text-start py-3 px-10">
                        Lista de Bonos Comprados
                    </th>
                </tr>
                <tr class="border-t border-gray-700 text-center">
                    <th scope="col" class="pl-3 py-3">
                        Nombre
                        <svg class="w-3 h-3 inline ml-1" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                    </th>
                    <th scope="col" class="pl-3 py-3">
                        Fecha de Emisión
                        <svg class="w-3 h-3 inline ml-1" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                    </th>
                    <th scope="col" class="pl-3 py-3">
                        Monto
                        <svg class="w-3 h-3 inline ml-1" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                    </th>
                    <th scope="col" class="pl-3 py-3">
                        TREA
                        <svg class="w-3 h-3 inline ml-1" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                    </th>
                    <th scope="col" class="pl-3 py-3">
                        Estado
                        <svg class="w-3 h-3 inline ml-1" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                    </th>
                    <th scope="col" class="pl-3 py-3">
                        Acciones
                    </th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let bond of dataSource | purchasedBonds:(userId() ?? undefined):userData?.role">
                    <td class="table-td font-light">{{bond.name}}</td>
                    <td class="table-td font-light">{{bond.issueDate }}</td>
                    <td class="table-td font-light">{{bond.nominalValue | number:'1.2-2'}}</td>
                    <td class="table-td font-light">{{bond.cashFlow?.trea | number:'1.5-5'}}%</td>
                    <td class="table-td font-light">
                      <ng-container *ngIf="bond.state === 'PURCHASED'">Comprado</ng-container>
                    </td>
                    <td class="table-td flex justify-evenly">
                        
                    <button class="cursor-pointer" (click)="goToBondDetail(bond.id)">
                        <svg class="size-8 stroke-white hover:stroke-gray-300" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 5 7 7-7 7"/>
                        </svg>
                    </button>
                    </td>
                </tr>
            </tbody>
        </table>
        
    </div>

    <!-- Pagination -->

    <div class="flex justify-end items-center space-x-2 mt-6 mr-15">
    
        <p class="mr-5">Items por página</p>
    
        <span class="flex items-center rounded-lg px-3 py-1 mr-8 bg-white font-semibold text-gray-700">
            {{currentPage}}
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
                class="size-4 ml-1 text-gray-500">
                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
            </svg>
    
        </span>
    
        <span class="space-x-5">
            <button class="px-3 py-1 rounded text-gray-500 font-bold hover:bg-gray-200 disabled:opacity-50"
                (click)="previousPage()" [disabled]="currentPage === 1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3"
                    stroke="currentColor" class="size-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                </svg>
                

    
            </button>
    
            <button class="px-3 py-1 rounded text-gray-500 font-bold hover:bg-gray-200  disabled:opacity-50"
                (click)="nextPage()" [disabled]="currentPage === totalPages">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3"
                    stroke="currentColor" class="size-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                </svg>
    
            </button>
        </span>
    
    </div>

</body>
