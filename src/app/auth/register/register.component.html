<div class="min-h-screen flex flex-col items-center justify-center">
    <div class="h-screen grid md:grid-cols-2 w-full">

        <!--Right-->
        <div class="flex flex-col h-full bg-white">

            <!---->
            <div class="flex flex-col justify-center items-center flex-1 p-12">
                <form [formGroup]="newUserForm" class="w-full max-w-md" (ngSubmit)="onSubmit()">
                    <h3 class="text-black lg:text-5xl text-4xl font-bold mb-8 text-center">
                        Regístrate
                    </h3>
                    <div class="space-y-6">
                        <div>
                            <label class='text-sm text-gray-700 font-medium mb-2 block'>Usuario</label>
                            <input name="username" type="username" formControlName="username" required class="outline-0 rounded-lg bg-gray-50 text-gray-900 focus:ring-gray-700 focus:border focus:border-gray-500 block flex-1 min-w-0 w-full text-sm p-3 shadow-md shadow-gray-500/50
                                " required />
                            <div *ngIf="username.invalid && username.touched" class="text-sm text-red-500 mt-1">
                                El nombre de usuario es obligatorio.
                            </div>

                        </div>
                        <div>
                            <label class='text-sm text-gray-700 font-medium mb-2 block'>Correo</label>
                            <input name="email" type="email" formControlName="email" required class="outline-0 rounded-lg bg-gray-50 text-gray-900 focus:ring-gray-700 focus:border focus:border-gray-500 block flex-1 min-w-0 w-full text-sm p-3 shadow-md shadow-gray-500/50
                                " required />
                            <div *ngIf="email.invalid && email.touched" class="text-sm text-red-500 mt-1">
                                El correo electrónico es obligatorio.
                            </div>
                        </div>
                        <div>
                            <label class='text-sm text-gray-700 font-medium mb-2 block'>Contraseña</label>
                            <input name="password" type="password" formControlName="password" required
                                class="outline-0 rounded-lg bg-gray-50 text-gray-900 focus:ring-gray-700 focus:border focus:border-gray-500 block flex-1 min-w-0 w-full text-sm p-3 shadow-md shadow-gray-500/50"
                                required />
                            <div *ngIf="password.invalid && password.touched" class="text-sm text-red-500 mt-1">
                                La contraseña es obligatoria.
                            </div>
                        </div>
                        <div>
                            <label class="text-sm text-gray-700 font-medium mb-2 block">Define tu rol</label>
                            <div class="flex items-center space-x-7 justify-center">
                                <button type="button" (click)="selectRole('ISSUER')" 
                                    [ngClass]="{
                                      'bg-teal-600 text-white': role.value === 'ISSUER',
                                      'bg-white text-gray-900': role.value !== 'ISSUER'
                                    }" 
                                    class="flex items-center flex-col shadow-md shadow-gray-500/50 p-6 text-sm font-semibold rounded-lg hover:bg-teal-600 hover:text-white focus:outline-none cursor-pointer group">
                                    <svg class="w-6 h-6"
                                        [ngClass]="{'fill-white': role.value === 'ISSUER', 'text-gray-800': role.value !== 'ISSUER'}"
                                        xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                                        <path fill-rule="evenodd"
                                            d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm-2 9a4 4 0 0 0-4 4v1a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1a4 4 0 0 0-4-4h-4Z"
                                            clip-rule="evenodd" />
                                    </svg>
                                    Emisor
                                </button>

                                <button type="button" (click)="selectRole('INVESTOR')" 
                                    [ngClass]="{
                                        'bg-teal-600 text-white': role.value === 'INVESTOR',
                                        'bg-white text-gray-900': role.value !== 'INVESTOR'
                                    }" 
                                    class="flex items-center flex-col shadow-md shadow-gray-500/50 p-6 text-sm font-semibold rounded-lg hover:bg-teal-600 hover:text-white focus:outline-none cursor-pointer group">
                                    <svg class="w-6 h-6"
                                        [ngClass]="{'fill-white': role.value === 'INVESTOR', 'text-gray-800': role.value !== 'INVESTOR'}"
                                        xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                                        <path fill-rule="evenodd"
                                            d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm-2 9a4 4 0 0 0-4 4v1a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1a4 4 0 0 0-4-4h-4Z"
                                            clip-rule="evenodd" />
                                    </svg>
                                    Inversor
                                </button>
                            </div>
                            <div *ngIf="role.invalid && newUserForm.touched"
                                class="text-red-500 text-sm mt-1 text-center">
                                Debes seleccionar un rol.
                            </div>
                        </div>


                    </div>

                    <div class="!mt-12">
                        <button type="submit" [disabled]="newUserForm.invalid"
                            class="w-full shadow-xl py-2.5 px-4 text-sm font-semibold rounded-lg text-white bg-teal-500 hover:bg-teal-800 focus:outline-none cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                            Registrarse
                        </button>
                    </div>
                    <p class="mt-10 text-center text-sm/6 font-extralight text-gray-700">
                        ¿Ya tienes una cuenta?
                        <a routerLink="/login" class="font-bold text-black hover:text-teal-500">Iniciar sesión</a>
                    </p>
                </form>
            </div>
        </div>

        <!-- Image -->
        <div class="flex flex-col h-full bg-white">

            <div class="flex justify-end -mb-12">
                <img src="assets/logo.png" alt="Logo"
                    class="ml-2 max-w-60 h-auto max-h-50 object-contain">
            </div>

            <img src="https://img.freepik.com/vector-premium/automatizacion-industria-bancaria-inteligencia-artificial-fintech_277904-38204.jpg?semt=ais_hybrid&w=740"
                alt="Login Background Image" class="hidden md:block object-contain w-full h-screen">
        </div>


    </div>
</div>
