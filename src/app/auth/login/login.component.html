<div class="min-h-screen flex flex-col items-center justify-center">
  <div class="h-screen grid md:grid-cols-2 w-full bg-white">
    <!-- Image -->
    <img
      src="https://img.freepik.com/vector-premium/automatizacion-industria-bancaria-inteligencia-artificial-fintech_277904-37963.jpg"
      alt="Login Background Image" class="hidden md:block object-contain w-full h-screen">

    <!---->

    <!--Right-->
    <div class="flex flex-col h-full bg-white rounded-tl-2xl rounded-bl-2xl">

      <!--Logo-->
      <div class="flex justify-end -mb-12">
          <img src="assets/logo.png" alt="Logo"
              class="ml-2 max-w-60 h-auto max-h-50 object-contain">
      </div>

      <!--Inputs-->
      <div class="flex flex-col justify-center items-center flex-1 p-12 ">
        <form [formGroup]="loginUserForm" class="w-full max-w-md" (ngSubmit)="onSubmit()">
          <p class="text-black lg:text-5xl text-4xl font-bold mb-8 text-center">¡Bienvenido!</p>

          <div class="space-y-6">
            <div>
              <label class='text-sm text-gray-700 font-medium mb-2 block'>Correo electrónico</label>
              <input name="email" type="email" formControlName="email" required
                class="outline-0 rounded-lg bg-gray-50 text-gray-900 focus:ring-gray-700 focus:border focus:border-gray-500 block flex-1 min-w-0 w-full text-sm p-3 shadow-md shadow-gray-500/50" />
                <div *ngIf="email.invalid && email.touched" class="text-sm text-red-500 mt-1">
                  El correo electrónico es obligatorio.
                </div>
              </div>

            <div>
              <label class='text-sm text-gray-700 font-medium mb-2 block'>Contraseña</label>
              <input name="password" type="password" formControlName="password" required
                class="outline-0 rounded-lg bg-gray-50 text-gray-900 focus:ring-gray-700 focus:border focus:border-gray-500 block flex-1 min-w-0 w-full text-sm p-3 shadow-md shadow-gray-500/50" />
                  <div *ngIf="password.invalid && password.touched" class="text-sm text-red-500 mt-1"><div *ngIf="password.invalid && password.touched" class="text-sm text-red-500 mt-1">
                    La contraseña es obligatoria.
                  </div>
                </div>
              </div>
          </div>

          <div class="!mt-12">
            <button type="submit"
              class="w-full shadow-xl py-2.5 px-4 text-sm font-semibold rounded-lg text-white bg-teal-500 hover:bg-teal-800 focus:outline-none cursor-pointer">
              Ingresar
            </button>
          </div>
          <p class="mt-10 text-center text-sm/6 font-extralight text-black">
            ¿No estás registrado?
            <a routerLink="/register" class="font-bold text-black hover:text-teal-500">Regístrate</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
